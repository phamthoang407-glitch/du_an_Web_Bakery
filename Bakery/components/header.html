<!--
  components/header.html
  Được main.js nạp vào <div data-component="header"></div>.
  - Link/ảnh/form nội bộ dùng data-href / data-src / data-action (đường dẫn tính từ thư mục gốc dự án).
  - data-nav khớp với <body data-page="…"> để tô sáng mục đang xem.
  - [data-cart-count] là badge số lượng giỏ hàng do main.js cập nhật.
-->
<header class="site-header" id="site-header">
  <!-- Thanh thông tin phía trên (chỉ hiện trên desktop) -->
  <div class="header__topbar">
    <div class="container header__topbar-inner">
      <p class="header__topbar-item">
        <svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>
        Đặt bánh: <a href="tel:19006969">1900 6969</a>
      </p>
      <p class="header__topbar-item">Miễn phí giao hàng đơn từ 300.000 ₫ · Nướng mới mỗi sáng, mở cửa 07:00 – 21:30</p>
    </div>
  </div>

  <!-- Thanh điều hướng chính -->
  <div class="container header__inner">
    <a class="header__logo" data-href="index.html" aria-label="Bơ Vàng Bakery – Về trang chủ">
      <svg class="header__logo-icon" width="36" height="36" viewBox="0 0 40 40" aria-hidden="true">
        <rect width="40" height="40" rx="12" fill="currentColor"/>
        <path d="M12 22h16l-2 10a2 2 0 0 1-2 1.6h-8a2 2 0 0 1-2-1.6z" fill="#fff8f0"/>
        <path d="M11 22c0-5 4-8 9-8s9 3 9 8z" fill="#f7c6cf"/>
        <circle cx="20" cy="11" r="2.4" fill="#e9a23b"/>
      </svg>
      <span class="header__logo-text">Bơ Vàng<small>Bakery</small></span>
    </a>

    <nav class="header__nav" id="main-nav" aria-label="Menu chính">
      <ul class="nav__list">
        <li><a class="nav__link" data-nav="home" data-href="index.html">Trang chủ</a></li>
        <li><a class="nav__link" data-nav="products" data-href="pages/products.html">Sản phẩm</a></li>
        <li><a class="nav__link" data-nav="stores" data-href="pages/stores.html">Cửa hàng</a></li>
        <li><a class="nav__link" data-nav="news" data-href="pages/news.html">Tin tức</a></li>
      </ul>

      <!-- Tìm kiếm nhanh: chuyển sang trang sản phẩm với ?keyword=… -->
      <form class="nav__search" role="search" method="get" data-action="pages/products.html">
        <label class="sr-only" for="header-search">Tìm kiếm sản phẩm</label>
        <input class="nav__search-input" id="header-search" type="search" name="keyword" placeholder="Tìm bánh kem, cupcake…" autocomplete="off" />
        <button class="nav__search-btn" type="submit" aria-label="Tìm kiếm">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        </button>
      </form>
    </nav>

    <div class="header__actions">
      <a class="header__action header__login" data-nav="login" data-href="pages/login.html" aria-label="Đăng nhập">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
        <span class="header__action-label">Đăng nhập</span>
      </a>

      <a class="header__action header__cart" data-href="pages/products.html" aria-label="Giỏ hàng">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        <span class="header__cart-count" data-cart-count hidden>0</span>
      </a>

      <button class="header__toggle" id="nav-toggle" type="button" aria-controls="main-nav" aria-expanded="false" aria-label="Mở menu">
        <span class="header__toggle-bar"></span>
        <span class="header__toggle-bar"></span>
        <span class="header__toggle-bar"></span>
      </button>
    </div>
  </div>
</header>
