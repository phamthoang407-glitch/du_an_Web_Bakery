<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hệ thống cửa hàng – Bơ Vàng Bakery</title>
    <meta name="description" content="Tìm cửa hàng Bơ Vàng Bakery gần bạn tại Hà Nội, TP. Hồ Chí Minh, Đà Nẵng và Hải Phòng: địa chỉ, giờ mở cửa, số điện thoại và bản đồ chỉ đường." />
    <meta name="theme-color" content="#b5533c" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🥐%3C/text%3E%3C/svg%3E" />

    <!-- Font (có hỗ trợ tiếng Việt). Bỏ 3 dòng này vẫn chạy bình thường với font dự phòng. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap&subset=vietnamese" rel="stylesheet" />

    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/header.css" />
    <link rel="stylesheet" href="../css/footer.css" />
    <link rel="stylesheet" href="../css/stores.css" />
  </head>

  <body data-page="stores">
    <a class="skip-link" href="#main">Bỏ qua đến nội dung chính</a>

    <!-- Header được nạp bởi js/main.js từ components/header.html -->
    <div data-component="header"></div>

    <main id="main">
      <section class="page-hero" aria-labelledby="page-title">
        <div class="container">
          <h1 id="page-title">Hệ thống cửa hàng</h1>
          <p>Ghé Bơ Vàng gần bạn để nhận bánh đặt trước, thưởng thức bánh còn ấm và xem thợ bánh làm việc ngay tại tiệm.</p>
        </div>
      </section>

      <div class="container stores-wrap">
        <nav aria-label="Breadcrumb">
          <ol class="breadcrumb">
            <li><a href="../index.html">Trang chủ</a></li>
            <li><span aria-current="page">Cửa hàng</span></li>
          </ol>
        </nav>

        <!-- ========== BỘ LỌC ========== -->
        <form class="stores-filter" id="stores-form" role="search" novalidate>
          <div class="stores-filter__field">
            <label for="store-search">Tìm cửa hàng</label>
            <input class="form-control" id="store-search" type="search" placeholder="Tên cửa hàng, quận, địa chỉ…" autocomplete="off" maxlength="80" />
          </div>
          <div class="stores-filter__field">
            <label for="store-city">Thành phố</label>
            <select class="form-control" id="store-city"></select>
          </div>
          <div class="stores-filter__field">
            <label for="store-service">Dịch vụ</label>
            <select class="form-control" id="store-service"></select>
          </div>
          <div class="stores-filter__actions">
            <label class="check-inline"><input type="checkbox" id="store-open" /><span>Chỉ hiện cửa hàng đang mở cửa</span></label>
            <button class="btn btn--ghost btn--sm" type="button" data-reset>Xóa bộ lọc</button>
          </div>
        </form>

        <p class="stores-count" id="store-count" role="status" aria-live="polite"></p>

        <!-- ========== DANH SÁCH + BẢN ĐỒ ========== -->
        <div class="stores-layout">
          <ul class="store-list" id="store-list" aria-label="Danh sách cửa hàng"></ul>

          <aside class="store-map" id="store-map" aria-label="Bản đồ cửa hàng">
            <div class="store-map__frame">
              <iframe id="map-frame" title="Bản đồ vị trí cửa hàng" loading="lazy" referrerpolicy="no-referrer-when-downgrade" sandbox="allow-scripts allow-same-origin allow-popups"></iframe>
            </div>
            <div class="store-map__info" id="map-info"></div>
          </aside>
        </div>
        <noscript><p class="empty-state">Vui lòng bật JavaScript để xem danh sách cửa hàng.</p></noscript>
      </div>
    </main>

    <!-- Footer được nạp bởi js/main.js từ components/footer.html -->
    <div data-component="footer"></div>

    <script src="../js/data.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/stores.js"></script>
  </body>
</html>
