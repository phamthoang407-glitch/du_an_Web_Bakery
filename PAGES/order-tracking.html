<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Theo dõi đơn hàng | Bakery Shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/header.css">
  <link rel="stylesheet" href="../css/footer.css">
  <link rel="stylesheet" href="../css/tracking.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="tracking">
  <div id="header"></div>
  <main>
    <section class="page-hero">
      <div class="container">
        <span class="eyebrow">MY ORDER</span>
        <h1>Theo dõi đơn hàng</h1>
        <p>Xem tiến trình chuẩn bị và giao chiếc bánh của bạn.</p>
      </div>
    </section>
    <div class="container tracking-wrap">
      <form class="track-search panel" id="track-form" novalidate>
        <label for="track-code">Tra cứu theo mã đơn hàng</label>
        <div class="track-search__row">
          <input id="track-code" type="text" placeholder="Ví dụ: BK123456" autocomplete="off">
          <button class="btn btn--primary" type="submit">Tra cứu</button>
        </div>
        <p class="track-err" id="track-err" role="alert"></p>
      </form>
      <div id="tracking-root"></div>
    </div>
  </main>
  <div id="footer"></div>
  <div id="toast" class="toast" role="status"></div>
  <nav id="mobile-nav"></nav>
  <script src="../js/data.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/order-tracking.js"></script>
</body>
</html>
